<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Tracker Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --panel-bg: rgba(11, 15, 22, 0.74);
      --panel-border: rgba(255,255,255,0.10);
      --text: #f7fbff;
      --muted: rgba(247,251,255,0.70);
      --line: rgba(255,255,255,0.08);
      --green: #66f09a;
      --yellow: #f4c251;
      --red: #ff7878;
      --pct: 0%;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent; color: var(--text); font-family: Inter, system-ui, sans-serif;
    }
    body { display: flex; align-items: flex-end; justify-content: flex-start; padding: 26px; }
    .card {
      width: min(760px, 95vw); border-radius: 28px; border: 1px solid var(--panel-border);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015)),
        var(--panel-bg);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden; position: relative;
    }
    .content { padding: 22px 22px 18px; display: grid; gap: 16px; }
    .top { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .title-block { display: grid; gap: 8px; }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px; color: var(--muted);
      font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.85); box-shadow: 0 0 18px rgba(255,255,255,0.45); }
    .title { font-size: 34px; line-height: 0.95; letter-spacing: -0.06em; font-weight: 900; }
    .subtitle { color: var(--muted); font-size: 14px; font-weight: 600; max-width: 440px; line-height: 1.32; }
    .status-pill {
      align-self: flex-start; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.05);
      padding: 10px 14px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .stat { border-radius: 20px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); padding: 14px 15px; min-width: 0; }
    .label { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
    .value { font-size: 30px; line-height: 1; font-weight: 900; letter-spacing: -0.05em; white-space: nowrap; }
    .bottom-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; color: var(--muted); font-size: 13px; font-weight: 700; }
    .bar-wrap { padding: 0 2px 2px; }
    .bar { height: 16px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid var(--line); overflow: hidden; position: relative; }
    .fill { width: var(--pct); height: 100%; transition: width 320ms ease; background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 54%, var(--red) 100%); box-shadow: inset 0 0 16px rgba(255,255,255,0.18); }
    .gloss { position: absolute; inset: 1px; border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,0.22), transparent 50%); pointer-events: none; }
    .flash-eat { animation: flashEat 700ms ease; }
    .flash-burn { animation: flashBurn 700ms ease; }
    @keyframes flashEat {
      0% { box-shadow: 0 0 0 0 rgba(255,120,120,.35), 0 24px 70px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.06); }
      100% { box-shadow: 0 0 0 26px rgba(255,120,120,0), 0 24px 70px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.06); }
    }
    @keyframes flashBurn {
      0% { box-shadow: 0 0 0 0 rgba(102,240,154,.30), 0 24px 70px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.06); }
      100% { box-shadow: 0 0 0 26px rgba(102,240,154,0), 0 24px 70px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.06); }
    }
    @media (max-width: 760px){
      body { padding: 12px; }
      .top { flex-direction: column; }
      .stats { grid-template-columns: 1fr; }
      .title { font-size: 28px; }
      .status-pill { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="content">
      <div class="top">
        <div class="title-block">
          <div class="kicker"><span class="dot"></span><span>Live Challenge</span></div>
          <div class="title" id="title">Calorie Tracker</div>
          <div class="subtitle" id="subtitle">Live progress for the challenge. Calories on board go up as food is added and go down as calories are burned.</div>
        </div>
        <div class="status-pill" id="statusPill">Ready</div>
      </div>

      <div class="stats">
        <div class="stat"><div class="label">Calories On Board</div><div class="value" id="remaining">0</div></div>
        <div class="stat"><div class="label">Calories Burned</div><div class="value" id="burned">0</div></div>
        <div class="stat"><div class="label">Target</div><div class="value" id="target">10,000</div></div>
      </div>

      <div class="bottom-row">
        <div id="leftMeta">Waiting for first update</div>
        <div id="rightMeta">0.0%</div>
      </div>

      <div class="bar-wrap">
        <div class="bar">
          <div class="fill"></div>
          <div class="gloss"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const DEFAULT_STATE = {
      title: "Calorie Tracker",
      subtitle: "Live progress for the challenge. Calories on board go up as food is added and go down as calories are burned.",
      targetCalories: 10000,
      remainingCalories: 0,
      burnedCalories: 0,
      lastActionType: "idle",
      updatedAt: Date.now()
    };

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Math.round(n || 0).toLocaleString();
    const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

    function readLocal() {
      try {
        const raw = localStorage.getItem("tenkTrackerState");
        return raw ? { ...DEFAULT_STATE, ...JSON.parse(raw) } : { ...DEFAULT_STATE };
      } catch {
        return { ...DEFAULT_STATE };
      }
    }

    function getStatusLabel(remaining, target) {
      const ratio = remaining / target;
      if (remaining <= 0) return "Cleared";
      if (ratio <= 0.2) return "Low";
      if (ratio <= 0.5) return "Mid";
      if (ratio <= 0.8) return "Loaded";
      return "Max Load";
    }

    function render(state) {
      const target = Math.max(1, Number(state.targetCalories || 10000));
      const remaining = clamp(Number(state.remainingCalories || 0), 0, target);
      const burned = clamp(Number(state.burnedCalories || (target - remaining)), 0, target);
      const pct = (remaining / target) * 100;

      document.documentElement.style.setProperty("--pct", pct + "%");
      $("title").textContent = state.title || DEFAULT_STATE.title;
      $("subtitle").textContent = state.subtitle || DEFAULT_STATE.subtitle;
      $("remaining").textContent = fmt(remaining);
      $("burned").textContent = fmt(burned);
      $("target").textContent = fmt(target);
      $("leftMeta").textContent = remaining <= 0 ? "All calories cleared" : fmt(target - remaining) + " calories cleared";
      $("rightMeta").textContent = pct.toFixed(1) + "% on board";
      $("statusPill").textContent = getStatusLabel(remaining, target);

      const card = $("card");
      card.classList.remove("flash-eat", "flash-burn");
      void card.offsetWidth;
      if (state.lastActionType === "eat") card.classList.add("flash-eat");
      if (state.lastActionType === "burn") card.classList.add("flash-burn");
    }

    function startLocal() {
      render(readLocal());
      window.addEventListener("storage", (e) => {
        if (e.key === "tenkTrackerState" && e.newValue) {
          try { render({ ...DEFAULT_STATE, ...JSON.parse(e.newValue) }); } catch {}
        }
      });
    }

    async function main() {
      const cfg = window.TRACKER_CONFIG;
      const hasFirebase = cfg && cfg.firebase && cfg.firebase.apiKey && cfg.databasePath;
      if (!hasFirebase) { startLocal(); return; }

      try {
        const app = initializeApp(cfg.firebase);
        const db = getDatabase(app);
        const stateRef = ref(db, cfg.databasePath);
        onValue(stateRef, (snap) => {
          render({ ...DEFAULT_STATE, ...(snap.val() || {}) });
        }, () => startLocal());
      } catch {
        startLocal();
      }
    }

    main();
  </script>
</body>
</html>
