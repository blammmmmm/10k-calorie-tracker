<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Tracker Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --panel-bg: rgba(11, 15, 22, 1);
      --panel-border: rgba(255,255,255,0.10);
      --text: #f7fbff;
      --muted: rgba(247,251,255,0.68);
      --line: rgba(255,255,255,0.08);
      --green: #66f09a;
      --yellow: #f4c251;
      --red: #ff7878;
      --pct: 0%;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent; color: var(--text); font-family: Inter, system-ui, sans-serif;
    }
    body { display: flex; align-items: flex-end; justify-content: flex-start; padding: 24px; }
   .card {
  width: min(760px, 95vw);
  border-radius: 28px;
  border: 1px solid var(--panel-border);
  background: var(--panel-bg);
  box-shadow: 0 24px 70px rgba(0,0,0,0.34);
  overflow: hidden;
  position: relative;
}
    .content { padding: 20px 20px 16px; display: grid; gap: 14px; }
    .top { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .title { font-size: 34px; line-height: 0.95; letter-spacing: -0.06em; font-weight: 900; }
    .target-pill {
      border-radius: 999px; border: 1px solid var(--line); background: (255,255,255,0.05);
      padding: 9px 13px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stat {
      border-radius: 18px; border: 1px solid var(--line); background: (255,255,255,0.05);
      padding: 14px 14px 12px; min-width: 0;
    }
    .label {
      color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 8px;
    }
    .value {
      font-size: 28px; line-height: 1; font-weight: 900; letter-spacing: -0.05em; white-space: nowrap;
    }
    .bottom-row {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      color: var(--muted); font-size: 12px; font-weight: 700;
    }
    .bar {
      height: 14px; border-radius: 999px; background: (255,255,255,0.08);
      border: 1px solid var(--line); overflow: hidden; position: relative;
    }
    .fill {
      width: var(--pct); height: 100%; transition: width 320ms ease;
      background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 54%, var(--red) 100%);
      box-shadow: inset 0 0 16px (255,255,255,0.18);
    }
    .gloss {
      position: absolute; inset: 1px; border-radius: inherit;
      background: linear-gradient(180deg, (255,255,255,0.18), transparent 52%);
      pointer-events: none;
    }
    .flash-eat { animation: flashEat 700ms ease; }
    .flash-burn { animation: flashBurn 700ms ease; }
    @keyframes flashEat {
      0% { box-shadow: 0 0 0 0 (255,120,120,.35), 0 24px 70px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.05); }
      100% { box-shadow: 0 0 0 24px rgba(255,120,120,0), 0 24px 70px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.05); }
    }
    @keyframes flashBurn {
      0% { box-shadow: 0 0 0 0 rgba(102,240,154,.30), 0 24px 70px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.05); }
      100% { box-shadow: 0 0 0 24px rgba(102,240,154,0), 0 24px 70px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.05); }
    }
    @media (max-width: 760px){
      body { padding: 12px; }
      .top { flex-direction: column; align-items: flex-start; }
      .stats { grid-template-columns: 1fr; }
      .title { font-size: 28px; }
      .target-pill { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="content">
      <div class="top">
        <div class="title" id="title">Calorie Tracker</div>
        <div class="target-pill" id="targetPill">Target 10,000</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="label">Calories Ate</div>
          <div class="value" id="ate">0</div>
        </div>
        <div class="stat">
          <div class="label">Calories Burned</div>
          <div class="value" id="burned">0</div>
        </div>
        <div class="stat">
          <div class="label">Remaining</div>
          <div class="value" id="remaining">0</div>
        </div>
      </div>

      <div class="bottom-row">
        <div id="leftMeta">0 eaten</div>
        <div id="rightMeta">0.0%</div>
      </div>

      <div class="bar">
        <div class="fill"></div>
        <div class="gloss"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const DEFAULT_STATE = {
      title: "Calorie Tracker",
      targetCalories: 10000,
      ateCalories: 0,
      burnedCalories: 0,
      lastActionType: "idle",
      updatedAt: Date.now()
    };

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Math.round(n || 0).toLocaleString();

    function readLocal() {
      try {
        const raw = localStorage.getItem("tenkTrackerState");
        return raw ? { ...DEFAULT_STATE, ...JSON.parse(raw) } : { ...DEFAULT_STATE };
      } catch {
        return { ...DEFAULT_STATE };
      }
    }

    function render(state) {
      const target = Math.max(1, Number(state.targetCalories || 10000));
      const ate = Math.max(0, Number(state.ateCalories || 0));
      const burned = Math.max(0, Number(state.burnedCalories || 0));
      const remaining = Math.max(ate - burned, 0);
      const pct = Math.min((ate / target) * 100, 100);

      document.documentElement.style.setProperty("--pct", pct + "%");
      $("title").textContent = state.title || DEFAULT_STATE.title;
      $("targetPill").textContent = "Target " + fmt(target);
      $("ate").textContent = fmt(ate);
      $("burned").textContent = fmt(burned);
      $("remaining").textContent = fmt(remaining);
      $("leftMeta").textContent = fmt(ate) + " eaten";
      $("rightMeta").textContent = pct.toFixed(1) + "%";

      const card = $("card");
      card.classList.remove("flash-eat", "flash-burn");
      void card.offsetWidth;
      if (state.lastActionType === "eat") card.classList.add("flash-eat");
      if (state.lastActionType === "burn") card.classList.add("flash-burn");
    }

    function startLocal() {
      render(readLocal());
      window.addEventListener("storage", (e) => {
        if (e.key === "tenkTrackerState" && e.newValue) {
          try { render({ ...DEFAULT_STATE, ...JSON.parse(e.newValue) }); } catch {}
        }
      });
    }

    async function main() {
      const cfg = window.TRACKER_CONFIG;
      const hasFirebase = cfg && cfg.firebase && cfg.firebase.apiKey && cfg.databasePath;
      if (!hasFirebase) { startLocal(); return; }

      try {
        const app = initializeApp(cfg.firebase);
        const db = getDatabase(app);
        const stateRef = ref(db, cfg.databasePath);
        onValue(stateRef, (snap) => {
          render({ ...DEFAULT_STATE, ...(snap.val() || {}) });
        }, () => startLocal());
      } catch {
        startLocal();
      }
    }

    main();
  </script>
</body>
</html>
