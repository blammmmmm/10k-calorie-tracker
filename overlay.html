<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10K Calorie Burn Tracker Overlay v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --panel: rgba(8,12,17,.78);
      --line: rgba(255,255,255,.09);
      --text: #f7fbff;
      --muted: rgba(247,251,255,.68);
      --green: #66f09a;
      --yellow: #f5c04e;
      --red: #ff7878;
      --bar: 0%;
      --glow: rgba(102,240,154,.22);
      --accent1: #7fe7ff;
      --accent2: #6f8cff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent; font-family: Inter, system-ui, sans-serif; color: var(--text);
    }
    body { display: flex; align-items: end; justify-content: start; padding: 28px; }
    .wrap { width: min(740px, 95vw); display: grid; gap: 18px; }
    .card {
      position: relative;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      padding: 20px;
      border-radius: 30px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 0% 0%, rgba(127,231,255,.12), transparent 28%),
        radial-gradient(circle at 100% 0%, rgba(111,140,255,.12), transparent 32%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)),
        var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0,0,0,.32);
      overflow: hidden;
    }
    .character-col { display: grid; place-items: center; }
    .stage {
      width: 220px; height: 220px; position: relative;
      display: grid; place-items: center;
    }
    .floor {
      position: absolute; bottom: 14px;
      width: 148px; height: 18px;
      background: rgba(0,0,0,.28); border-radius: 999px; filter: blur(10px);
    }
    .sprite {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      animation: pop .38s ease;
      transform-origin: center bottom;
    }
    .sprite.active { display: flex; }
    @keyframes pop {
      0% { transform: scale(.88) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .badge {
      position: absolute; right: 0; top: 4px;
      padding: 10px 14px; border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
      text-transform: uppercase; letter-spacing: .09em;
      font-size: 11px; font-weight: 800;
    }
    .character-note {
      position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%);
      color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      white-space: nowrap;
    }

    .info { display: grid; gap: 14px; align-content: center; }
    .eyebrow {
      font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
    }
    .title {
      font-size: 38px; line-height: .92; letter-spacing: -.06em; font-weight: 900;
      max-width: 380px;
    }
    .subtitle {
      color: var(--muted); font-size: 14px; font-weight: 600; max-width: 430px; line-height: 1.35;
    }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    }
    .stat {
      padding: 14px 15px; border-radius: 18px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
      min-width: 0;
    }
    .stat .label {
      font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px;
    }
    .stat .value {
      font-size: 28px; line-height: 1; font-weight: 900; letter-spacing: -.05em;
    }
    .progress-meta {
      display: flex; justify-content: space-between; gap: 12px;
      font-size: 13px; color: var(--muted); font-weight: 800;
    }
    .bar {
      position: relative; height: 24px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; width: var(--bar); transition: width .34s ease;
      background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 56%, var(--red) 100%);
      box-shadow: inset 0 0 16px rgba(255,255,255,.18);
    }
    .bar-gloss {
      position: absolute; inset: 1px; border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.22), transparent 45%);
      pointer-events: none;
    }

    .flash-eat { animation: ringEat .7s ease; }
    .flash-burn { animation: ringBurn .7s ease; }
    @keyframes ringEat {
      0% { box-shadow: 0 0 0 0 rgba(255,120,120,.45), 0 24px 60px rgba(0,0,0,.32); }
      100% { box-shadow: 0 0 0 28px rgba(255,120,120,0), 0 24px 60px rgba(0,0,0,.32); }
    }
    @keyframes ringBurn {
      0% { box-shadow: 0 0 0 0 rgba(102,240,154,.42), 0 24px 60px rgba(0,0,0,.32); }
      100% { box-shadow: 0 0 0 28px rgba(102,240,154,0), 0 24px 60px rgba(0,0,0,.32); }
    }

    svg { overflow: visible; }
    @media (max-width: 760px){
      body{ padding: 12px; }
      .card{ grid-template-columns: 1fr; }
      .stats{ grid-template-columns: 1fr; }
      .title{ font-size: 30px; }
      .character-col{ order: -1; }
    }
  </style>
</head>

  <script src="config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const DEFAULT_STATE = {
      title: "Burn It All Off",
      subtitle: "Eat 10,000 calories. Stay in the gym until every last one is gone.",
      eyebrow: "10K calorie prison",
      targetCalories: 10000,
      remainingCalories: 0,
      burnedCalories: 0,
      lastActionType: "idle",
      updatedAt: Date.now()
    };

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Math.round(n || 0).toLocaleString();
    const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

    function readLocal() {
      try {
        const raw = localStorage.getItem("tenkTrackerState");
        return raw ? { ...DEFAULT_STATE, ...JSON.parse(raw) } : { ...DEFAULT_STATE };
      } catch {
        return { ...DEFAULT_STATE };
      }
    }

    function getSpriteIndex(ratio) {
      if (ratio <= .12) return 0;
      if (ratio <= .32) return 1;
      if (ratio <= .55) return 2;
      if (ratio <= .80) return 3;
      return 4;
    }

    function getStateText(index, remaining) {
      if (remaining <= 0) return ["Freedom", "Escaped the food prison"];
      return [
        ["Jacked", "Locked in"],
        ["Lean", "Still sharp"],
        ["Normal", "Holding steady"],
        ["Stuffed", "Calories piling up"],
        ["Maxed out", "Absolute food demon"]
      ][index];
    }

    function render(state) {
      const target = Math.max(1, Number(state.targetCalories || 10000));
      const remaining = clamp(Number(state.remainingCalories || 0), 0, target);
      const burned = clamp(Number(state.burnedCalories || (target - remaining)), 0, target);
      const ratio = remaining / target;
      const pct = ratio * 100;
      const spriteIndex = getSpriteIndex(ratio);
      const [note, badge] = getStateText(spriteIndex, remaining);

      document.documentElement.style.setProperty("--bar", pct + "%");

      $("eyebrow").textContent = state.eyebrow || DEFAULT_STATE.eyebrow;
      $("title").textContent = state.title || DEFAULT_STATE.title;
      $("subtitle").textContent = state.subtitle || DEFAULT_STATE.subtitle;
      $("remaining").textContent = fmt(remaining);
      $("burned").textContent = fmt(burned);
      $("target").textContent = fmt(target);
      $("rightMeta").textContent = pct.toFixed(1) + "% loaded";
      $("leftMeta").textContent = remaining <= 0 ? "Every calorie cleared"
        : remaining >= target ? "Full 10K loaded"
        : fmt(target - remaining) + " calories cleared";
      $("characterNote").textContent = "Current physique: " + note;
      $("stateBadge").textContent = badge;

      document.querySelectorAll(".sprite").forEach((node, i) => {
        node.classList.toggle("active", i === spriteIndex);
      });

      const card = $("card");
      card.classList.remove("flash-eat", "flash-burn");
      void card.offsetWidth;
      if (state.lastActionType === "eat") card.classList.add("flash-eat");
      if (state.lastActionType === "burn") card.classList.add("flash-burn");
    }

    function startLocal() {
      render(readLocal());
      window.addEventListener("storage", (e) => {
        if (e.key === "tenkTrackerState" && e.newValue) {
          try { render({ ...DEFAULT_STATE, ...JSON.parse(e.newValue) }); } catch {}
        }
      });
    }

    async function main() {
      const cfg = window.TRACKER_CONFIG;
      const hasFirebase = cfg && cfg.firebase && cfg.firebase.apiKey && cfg.databasePath;
      if (!hasFirebase) {
        startLocal();
        return;
      }

      try {
        const app = initializeApp(cfg.firebase);
        const db = getDatabase(app);
        const stateRef = ref(db, cfg.databasePath);
        onValue(stateRef, (snap) => {
          render({ ...DEFAULT_STATE, ...(snap.val() || {}) });
        }, () => startLocal());
      } catch {
        startLocal();
      }
    }

    main();
  </script>
</body>
</html>
