<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Tracker Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #0a0f15; --panel: #101720; --panel-2: #141d29; --line: rgba(255,255,255,0.08);
      --text: #f7fbff; --muted: rgba(247,251,255,0.68); --green: #66f09a; --yellow: #f4c251; --red: #ff7878;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); font-family: Inter, system-ui, sans-serif; padding: 18px;
      background:
        radial-gradient(circle at top left, rgba(127,217,255,0.08), transparent 26%),
        radial-gradient(circle at top right, rgba(255,255,255,0.05), transparent 20%),
        linear-gradient(180deg, #091018 0%, #0a0f15 100%);
    }
    .app { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }
    .card {
      border-radius: 28px; border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)), var(--panel);
      box-shadow: 0 24px 70px rgba(0,0,0,0.28); padding: 20px;
    }
    .hero { display: grid; gap: 8px; }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 48px); line-height: 0.95; letter-spacing: -0.06em; }
    .hero p { margin: 0; color: var(--muted); font-weight: 600; }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 2px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--yellow); }
    .status-dot.live { background: var(--green); }
    .grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 18px; }
    .section-title { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .stat { border-radius: 18px; border: 1px solid var(--line); background: var(--panel-2); padding: 14px; }
    .stat-k { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    .stat-v { font-size: 28px; font-weight: 900; letter-spacing: -0.05em; }
    .bar { height: 18px; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); background: rgba(255,255,255,0.08); margin-bottom: 16px; }
    .fill { height: 100%; width: 0%; transition: width 260ms ease; background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 54%, var(--red) 100%); }
    label { display: grid; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 12px; }
    input, textarea, button { width: 100%; font: inherit; border-radius: 16px; }
    input, textarea { border: 1px solid var(--line); background: #0b121a; color: var(--text); padding: 14px; outline: none; }
    textarea { min-height: 92px; resize: vertical; }
    button { border: 0; padding: 14px 16px; font-weight: 800; cursor: pointer; }
    .btn-dark { background: #223142; color: var(--text); border: 1px solid var(--line); }
    .btn-red { background: var(--red); color: #250707; }
    .btn-green { background: var(--green); color: #09110b; }
    .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .helper { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
    @media (max-width: 920px) { .grid, .stats, .row, .quick-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="card hero">
      <div class="eyebrow">Remote stream control</div>
      <h1>Calorie Tracker</h1>
      <p>Premium minimal controller. Same exact logic, cleaner look.</p>
      <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">Checking connection…</span></div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="section-title">Live State</div>
        <div class="stats">
          <div class="stat"><div class="stat-k">Calories On Board</div><div class="stat-v" id="remaining">0</div></div>
          <div class="stat"><div class="stat-k">Calories Burned</div><div class="stat-v" id="burned">0</div></div>
          <div class="stat"><div class="stat-k">Target</div><div class="stat-v" id="target">10,000</div></div>
        </div>
        <div class="bar"><div class="fill" id="fill"></div></div>

        <label>Title<input id="titleInput" placeholder="Calorie Tracker" /></label>
        <label>Subtitle<textarea id="subtitleInput" placeholder="Live progress for the challenge. Calories on board go up as food is added and go down as calories are burned."></textarea></label>
        <label>Target Calories<input id="targetInput" type="number" min="1" step="1" placeholder="10000" /></label>

        <div class="row">
          <button class="btn-dark" id="saveBtn">Save Settings</button>
          <button class="btn-dark" id="resetBtn">Reset Tracker</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Controls</div>

        <label>Add calories<input id="addInput" type="number" min="0" step="1" placeholder="1200" /></label>
        <div class="row">
          <button class="btn-red" id="addBtn">Add Calories</button>
          <button class="btn-dark" id="undoAddBtn">Undo Add</button>
        </div>
        <div class="quick-grid">
          <button class="btn-dark quick-add" data-amount="250">+250</button>
          <button class="btn-dark quick-add" data-amount="500">+500</button>
          <button class="btn-dark quick-add" data-amount="1000">+1000</button>
          <button class="btn-dark quick-add" data-amount="1500">+1500</button>
          <button class="btn-dark quick-add" data-amount="2000">+2000</button>
          <button class="btn-dark quick-add" data-amount="2500">+2500</button>
        </div>

        <div style="height: 14px;"></div>

        <label>Burn calories<input id="burnInput" type="number" min="0" step="1" placeholder="300" /></label>
        <div class="row">
          <button class="btn-green" id="burnBtn">Burn Calories</button>
          <button class="btn-dark" id="undoBurnBtn">Undo Burn</button>
        </div>
        <div class="quick-grid">
          <button class="btn-dark quick-burn" data-amount="100">-100</button>
          <button class="btn-dark quick-burn" data-amount="250">-250</button>
          <button class="btn-dark quick-burn" data-amount="500">-500</button>
          <button class="btn-dark quick-burn" data-amount="750">-750</button>
          <button class="btn-dark quick-burn" data-amount="1000">-1000</button>
          <button class="btn-dark quick-burn" data-amount="1500">-1500</button>
        </div>

        <div class="helper">Firebase-ready. Replace the current files in GitHub with these and keep the same config path.</div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const DEFAULT_STATE = {
      title: "Calorie Tracker",
      subtitle: "Live progress for the challenge. Calories on board go up as food is added and go down as calories are burned.",
      targetCalories: 10000,
      remainingCalories: 0,
      burnedCalories: 0,
      lastActionType: "idle",
      updatedAt: Date.now()
    };

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Math.round(n || 0).toLocaleString();
    const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

    let usingLocal = false;
    let current = { ...DEFAULT_STATE };
    let stateRef = null;

    function localRead() {
      try {
        const raw = localStorage.getItem("tenkTrackerState");
        return raw ? { ...DEFAULT_STATE, ...JSON.parse(raw) } : { ...DEFAULT_STATE };
      } catch {
        return { ...DEFAULT_STATE };
      }
    }

    function localWrite(next) {
      localStorage.setItem("tenkTrackerState", JSON.stringify(next));
      render(next);
    }

    function setStatus(live, text) {
      $("statusText").textContent = text;
      $("statusDot").classList.toggle("live", live);
    }

    function render(state) {
      current = { ...DEFAULT_STATE, ...state };
      const target = Math.max(1, Number(current.targetCalories || 10000));
      const remaining = clamp(Number(current.remainingCalories || 0), 0, target);
      const burned = clamp(Number(current.burnedCalories || (target - remaining)), 0, target);
      const pct = (remaining / target) * 100;

      $("remaining").textContent = fmt(remaining);
      $("burned").textContent = fmt(burned);
      $("target").textContent = fmt(target);
      $("fill").style.width = pct + "%";

      $("titleInput").value = current.title || "";
      $("subtitleInput").value = current.subtitle || "";
      $("targetInput").value = target;
    }

    async function writeState(updater) {
      const next = typeof updater === "function" ? updater({ ...current }) : { ...current, ...updater };
      next.updatedAt = Date.now();

      if (usingLocal || !stateRef) {
        localWrite(next);
        return;
      }
      await set(stateRef, next);
    }

    function num(id) { return Math.max(0, Number($(id).value || 0)); }

    async function addCalories(amount) {
      if (!amount) return;
      await writeState((prev) => {
        const target = Math.max(1, Number(prev.targetCalories || 10000));
        const remaining = clamp(Number(prev.remainingCalories || 0) + amount, 0, target);
        return { ...prev, remainingCalories: remaining, burnedCalories: clamp(target - remaining, 0, target), lastActionType: "eat" };
      });
    }

    async function burnCalories(amount) {
      if (!amount) return;
      await writeState((prev) => {
        const target = Math.max(1, Number(prev.targetCalories || 10000));
        const remaining = clamp(Number(prev.remainingCalories || 0) - amount, 0, target);
        return { ...prev, remainingCalories: remaining, burnedCalories: clamp(target - remaining, 0, target), lastActionType: "burn" };
      });
    }

    async function init() {
      const cfg = window.TRACKER_CONFIG;
      const hasFirebase = cfg && cfg.firebase && cfg.firebase.apiKey && cfg.databasePath;

      if (!hasFirebase) {
        usingLocal = true;
        render(localRead());
        setStatus(true, "Local test mode");
        window.addEventListener("storage", (e) => {
          if (e.key === "tenkTrackerState" && e.newValue) {
            try { render({ ...DEFAULT_STATE, ...JSON.parse(e.newValue) }); } catch {}
          }
        });
        return;
      }

      try {
        const app = initializeApp(cfg.firebase);
        const db = getDatabase(app);
        stateRef = ref(db, cfg.databasePath);
        const snap = await get(stateRef);
        if (!snap.exists()) await set(stateRef, { ...DEFAULT_STATE });

        onValue(stateRef, (snap) => {
          render({ ...DEFAULT_STATE, ...(snap.val() || {}) });
          setStatus(true, "Live with Firebase");
        });
      } catch (err) {
        console.error(err);
        usingLocal = true;
        render(localRead());
        setStatus(false, "Firebase failed — local test mode");
      }
    }

    $("saveBtn").addEventListener("click", async () => {
      const target = Math.max(1, Number($("targetInput").value || 10000));
      await writeState((prev) => {
        const remaining = clamp(Number(prev.remainingCalories || 0), 0, target);
        return {
          ...prev,
          title: $("titleInput").value.trim() || DEFAULT_STATE.title,
          subtitle: $("subtitleInput").value.trim() || DEFAULT_STATE.subtitle,
          targetCalories: target,
          remainingCalories: remaining,
          burnedCalories: clamp(target - remaining, 0, target),
          lastActionType: "idle"
        };
      });
    });

    $("resetBtn").addEventListener("click", () => writeState({ ...DEFAULT_STATE }));
    $("addBtn").addEventListener("click", () => addCalories(num("addInput")));
    $("burnBtn").addEventListener("click", () => burnCalories(num("burnInput")));
    $("undoAddBtn").addEventListener("click", () => burnCalories(num("addInput")));
    $("undoBurnBtn").addEventListener("click", () => addCalories(num("burnInput")));

    document.querySelectorAll(".quick-add").forEach((btn) => {
      btn.addEventListener("click", () => addCalories(Number(btn.dataset.amount)));
    });

    document.querySelectorAll(".quick-burn").forEach((btn) => {
      btn.addEventListener("click", () => burnCalories(Number(btn.dataset.amount)));
    });

    init();
  </script>
</body>
</html>
